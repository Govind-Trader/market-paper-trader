name: Run Historical Backtest

on:
  workflow_dispatch: # Isse aap manually ek button daba kar run kar payenge

jobs:
  run-simulation:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Libraries
        run: |
          pip install yfinance pandas pytz requests

      - name: Run Backtester Script
        run: |
          python backtester.py

      - name: Commit trades_db.json
        run: |
          git config --global user.name "GitHub Action"
          git config --global user.email "action@github.com"
          git add trades_db.json
          git commit -m "Auto-generated 60-day trades_db.json" || exit 0
          git push
