name: Run Historical Backtest

on:
  workflow_dispatch:
  schedule:
    - cron: '30 18 * * 1-5'

jobs:
  backtest:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install logzero websocket-client smartapi-python pyotp pandas numpy pytz yfinance requests

      - name: Run 4-Hour Backtester with SmartAPI
        env:
          SMARTAPI_KEY: ${{ secrets.SMARTAPI_KEY }}
          SMARTAPI_CLIENT_CODE: ${{ secrets.SMARTAPI_CLIENT_CODE }}
          SMARTAPI_PIN: ${{ secrets.SMARTAPI_PIN }}
          SMARTAPI_TOTP_KEY: ${{ secrets.SMARTAPI_TOTP_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python backtester.py

      - name: Commit and Push Updated Database
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add trades_db.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update 4H backtest database [skip ci]" && git push)
