name: Live Market 15-Min Scanner

on:
  schedule:
    # Runs Monday to Friday, every 15 mins during market hours (03:45 UTC to 10:00 UTC = 09:15 AM to 03:30 PM IST)
    - cron: '*/15 4-10 * * 1-5'
  workflow_dispatch:

jobs:
  market-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          pip install yfinance pandas requests pytz

      - name: Run Market Scanner
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python live_scanner.py
