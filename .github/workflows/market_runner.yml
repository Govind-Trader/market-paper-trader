name: Market Hours Automation Engine

on:
  schedule:
    # Monday to Friday har 5 min: 9:15 AM to 3:30 PM IST (03:45 to 10:00 UTC)
    - cron: '*/5 3-10 * * 1-5'
  workflow_dispatch:

jobs:
  run-market-scanner:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          pip install -r requirements.txt

      - name: Execute Trading Engine
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python bot.py
