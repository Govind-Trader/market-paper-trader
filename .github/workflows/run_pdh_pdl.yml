name: Run PDH PDL 15m Backtest
on:
  workflow_dispatch:

jobs:
  backtest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: pip install pandas pyotp smartapi-python logzero websocket-client pytz requests
      - name: Execute PDH/PDL Backtest
        env:
          SMARTAPI_KEY: ${{ secrets.SMARTAPI_KEY }}
          CLIENT_CODE: ${{ secrets.CLIENT_CODE }}
          PIN: ${{ secrets.PIN }}
          TOTP_KEY: ${{ secrets.TOTP_KEY }}
        run: python backtest_pdh_pdl.py
